[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 800
via_ir = false
evm_version = "cancun"
ffi = true
fs_permissions = [{ access = "read-write", path = "./" }]
gas_limit = "3000000000"

[profile.ci]
fuzz.runs = 10_000

[rpc_endpoints]
unichain_sepolia = "https://sepolia.unichain.org"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
mainnet = "${MAINNET_RPC_URL}"
